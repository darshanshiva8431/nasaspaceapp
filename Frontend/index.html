<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Emission Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Carbon Emission Data</h1>
        <div id="output">
            <p class="loading">Loading emission data...</p>
            <div class="result" id="result" style="display: none;">
                <h2>Emission: <span id="emissionValue">0</span> gCO₂</h2>
                <h3>Location: <span id="locationValue">[0, 0]</span></h3>
            </div>
        </div>
        <button id="fetchButton">Fetch Emission Data</button>
    </div>
    
    <script>
        document.getElementById('fetchButton').addEventListener('click', function() {
            fetch('/api/emission')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert('Error: ' + data.error);
                    } else {
                        document.getElementById('emissionValue').textContent = data.emission.toFixed(2);
                        document.getElementById('locationValue').textContent = `[${data.location[0]}, ${data.location[1]}]`;
                        document.querySelector('.loading').style.display = 'none';
                        document.getElementById('result').style.display = 'block';
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
</body>
</html>
